<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e11d48;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb7185;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" fill="#050509" rx="8"/>
  
  <!-- N Letter - Left side -->
  <g fill="url(#grad1)">
    <!-- N vertical left -->
    <rect x="15" y="20" width="12" height="70" rx="2"/>
    <!-- N diagonal -->
    <polygon points="27,20 65,90 58,90 20,20"/>
    <!-- N vertical right -->
    <rect x="56" y="50" width="12" height="40" rx="2"/>
  </g>
  
  <!-- Q Letter - Right side (interlocking with N) -->
  <g fill="url(#grad1)">
    <!-- Q circle -->
    <circle cx="85" cy="65" r="28" />
    <!-- Q tail -->
    <path d="M 95 88 Q 105 85 108 95 Q 110 100 102 102" stroke="url(#grad1)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Cutout for Q (white space for visibility) -->
    <circle cx="85" cy="65" r="18" fill="#050509"/>
  </g>
  
  <!-- Accent line connecting N and Q -->
  <line x1="65" y1="45" x2="57" y2="50" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"/>
</svg>